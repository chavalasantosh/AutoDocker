[package]
name = "autodocker"
version = "3.0.0-rc10.1"
edition = "2024"
authors = ["Chavala Santosh <santoshysc@gmail.com>"]
description = "Auto Docker: Autonomous, zero-dependency container infrastructure generator and deployment orchestrator"
readme = "../README.md"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[[bin]]
name = "autodocker"
path = "src/main.rs"

[lib]
name = "autodocker"
path = "src/lib.rs"
